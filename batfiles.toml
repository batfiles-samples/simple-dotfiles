# A batfiles leaf repository.
#
# Two action types exist today, and both make symlinks:
#
#   symlink      one source, one exact destination
#   symlink-dir  every direct child of a directory, into one directory
#
# The rule this repository is arranged around: if a file's destination is its
# own name in some directory, `symlink-dir` covers it and you never touch the
# manifest again. If the destination is a *different* name, or somewhere of its
# own, it needs a `symlink` that says so.
#
# Actions run in the order they are written here.

# ---------------------------------------------------------------------------
# files/ -> ~/.<name>
# ---------------------------------------------------------------------------

# One entry for every plain dotfile. `dot-prefix` adds the leading `.`, which
# is why the repository can keep them undotted and readable.
#
# The payoff: `files/ackrc` is installed by this action and is named nowhere.
# It was dropped into the directory, and the next sync picked it up. Adding
# `files/inputrc` tomorrow needs no change here either.
[[actions]]
type = "symlink-dir"
id = "rcfiles"
group = "shell"
source-dir = "files"
dest-dir = "~"
dot-prefix = true

# ---------------------------------------------------------------------------
# bin/ -> ~/.local/bin/<name>
# ---------------------------------------------------------------------------

# The same action without `dot-prefix`, because a script on the PATH keeps its
# name. `~/.local/bin` need not exist — a missing `dest-dir` is created.
#
# A symlink carries no mode of its own, so these stay executable because the
# files in the repository are. Keep the bit set in Git and it survives.
[[actions]]
type = "symlink-dir"
id = "binfiles"
group = "bin"
source-dir = "bin"
dest-dir = "~/.local/bin"

# ---------------------------------------------------------------------------
# The ones that have to be named individually
# ---------------------------------------------------------------------------

# Everything below installs under a name, or in a place, that does not match
# its source. No directory action can express that, and this is the whole of
# when you still reach for `symlink`.

# `gitignore` here, `ignore` there. A dotfiles repository reads better without
# a tree of dot-directories in it, and the manifest is where the two naming
# schemes get reconciled.
[[actions]]
type = "symlink"
id = "gitignore"
group = "git"
source = "git/gitignore"
dest = "~/.config/git/ignore"

# Two directories away from where it lives here. Missing parents are created.
[[actions]]
type = "symlink"
id = "zsh-aliases"
group = "shell"
source = "shell/aliases.zsh"
dest = "~/.config/zsh/aliases.zsh"

# A `source` may be a directory: one link at the destination, and the whole
# tree reachable through it. Note how this differs from `symlink-dir` above —
# that links a directory's *children*, one link each; this links the directory
# itself, one link total. So a file added under `editor/nvim/` later appears
# with no sync at all.
[[actions]]
type = "symlink"
id = "nvim"
group = "editor"
source = "editor/nvim"
dest = "~/.config/nvim"

[[actions]]
type = "symlink"
id = "tmux"
group = "tmux"
source = "tmux/tmux.conf"
dest = "~/.config/tmux/tmux.conf"
